name: YTWatch

options:
  bundleIdPrefix: com.andre.ytwatch
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16"
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release


settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_STRICT_CONCURRENCY_CHECKING: complete
    # Keep these in step with what's uploaded: the archive passes
    # CURRENT_PROJECT_VERSION on the command line, and App Store Connect rejects any
    # build number it has already seen, so bump this here whenever a build ships.
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "76"
    # Shared by the Watch app and its widget. Change it with the bundle IDs if you sign
    # with your own team (group IDs are global). Sideloaded builds ignore it.
    APP_GROUP_ID: group.com.andre.ytwatch.app
  configs:
    Debug:
      ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: YES

targets:

  # ── iOS App ────────────────────────────────────────────────────────────────
  YTWatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
        excludes: []
      - path: Shared
      - path: iOS/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andre.ytwatch.app
        INFOPLIST_FILE: Config/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: YTWatch Watch App
    entitlements:
      path: Config/iOS.entitlements

  # ── watchOS App ────────────────────────────────────────────────────────────
  YTWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: watchOS
        excludes:
          - "Widgets/**"
      - path: Shared
      - path: watchOS/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andre.ytwatch.app.watchkitapp
        INFOPLIST_FILE: Config/watchOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/watchOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: YTWatch Watch Widgets
    entitlements:
      path: Config/watchOS.entitlements
      properties:
        # Shared with the Now Playing widget. Sideloaders (WatchBridge) replace it with
        # group.<their rewritten app ID>; SharedContainer finds whichever was granted.
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

  # ── watchOS Widgets (Smart Stack / complications) ──────────────────────────
  YTWatch Watch Widgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: watchOS/Widgets
      - path: watchOS/WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andre.ytwatch.app.watchkitapp.widgets
        INFOPLIST_FILE: Config/watchOS-Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/watchOS-Widgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Config/watchOS-Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
